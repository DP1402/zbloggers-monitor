name: Daily collection and analysis

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC every day
  workflow_dispatch: {}     # allows manual "Run workflow" button

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect posts
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python scraper/collect.py --days 1.5

      - name: Analyze yesterday and write the brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/analyze.py

      - name: Publish newsletter feed
        run: python scraper/newsletter.py --feed

      - name: Send newsletter (optional email fallback)
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python scraper/newsletter.py

      - name: Commit and push results
        run: |
          git config user.name "zbloggers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily data update $(date -u +%F)"
          git push
