name: Search archive

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Search query (theme/question)"
        required: true
      request_id:
        description: "Unique ID for this search request"
        required: true

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEARCH_QUERY: ${{ github.event.inputs.query }}
      REQUEST_ID: ${{ github.event.inputs.request_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run search
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/search.py

      - name: Commit and push result
        run: |
          git config user.name "zbloggers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/search
          git commit -m "Search result $REQUEST_ID" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && break
            echo "push failed, retrying ($i)..."
            sleep $((RANDOM % 5 + 2))
          done
